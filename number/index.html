/* =========================================================
   パン & ズーム
========================================================= */
const app = document.getElementById('app');
const viewport = document.getElementById('viewport');

let scale = 1, panX = 0, panY = 0;
const MIN_SCALE = 0.05, MAX_SCALE = 26;

function applyTransform(){
  world.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
}

/* --- 星のサイズ上限・ズーム連動の表示切り替え ---
   星の見かけサイズは「画面上の絶対px」で頭打ちにする（TARGET_STAR_PX）。
   これによりビューポートの大きさに関わらず、必ずタップしやすく
   3桁の数字がゆったり収まるサイズ（約48〜56px）まで素直に拡大してから
   頭打ちになり、それ以降のズームでは星同士の間隔だけが広がっていく。

   観測完了の星は、ズームに応じて次の段階でクロスフェードする：
     1. 引き　　：淡い光の点（.particle）＝銀河の渦が見える全体表示
     2. 中ズーム：くっきりしたカット面SVG（.detail）へフェード
     3. 寄り　　：カット面はそのまま、数字ラベル（.star-label）が浮かび上がる
   未完成の星（ちいさな点／丸のプレースホルダー）は、この3.と完全に同じ
   タイミング（--zoom-label）で、6等星のようにふわっと同時に姿を現す
   （それより手前ではSTAGE1〜3同様ずっと非表示のまま）。 */
let baseScale = 1;
const DETAIL_LOW_MULT = 0.4;    // baseScale比：この倍率からカット面が現れ始める（遠景→中景）
const DETAIL_HIGH_MULT = 0.85;  // baseScale比：この倍率で完全にカット面へ（既定表示に入る前に完了）
const TARGET_STAR_PX = 52;      // 星の見かけサイズが頭打ちになる、画面上の絶対サイズ(px)
const CAP_SCALE = TARGET_STAR_PX / STAR_SIZE; // 上記を満たす絶対スケール値（ビューポートに依存しない）
const DEFAULT_STAR_PX = 34;     // デフォルト画角で星がしっかり肉眼で認識できるサイズ(px)
const DEFAULT_ZOOM_SCALE = DEFAULT_STAR_PX / STAR_SIZE; // 上記を満たす絶対スケール値
const LABEL_SCALE_MULT = 0.62; // CAP_SCALE比：星がまだ頭打ち前で少し小さいこの時点から数字ラベルを表示する
const LABEL_SCALE = CAP_SCALE * LABEL_SCALE_MULT;

function clamp01(v){ return Math.max(0, Math.min(1, v)); }

// 中心「1」の太陽：本体（.origin-inner）は、通常の星の頭打ちサイズ（TARGET_STAR_PX）
// より一回り大きい、堂々とした絶対pxで頭打ちにする（baseScaleのような画面に応じて
// 変わる相対値には依存しない＝定義が変わっても連動して壊れない）。
// ※通常の星と完全に同じサイズにすると、中心星としての存在感が弱くなりすぎる。
//   かといって以前のbaseScale相対の計算は、baseScaleの定義変更に連動して
//   肥大化する事故を起こしたため（本体だけで画面の半分近くを覆うほど巨大化）、
//   ここでも通常の星と同じ「絶対px基準」を踏襲しつつ、目標pxだけを大きくする。
const TARGET_ORIGIN_PX = 84;  // 「1」の本体が頭打ちになる、画面上の絶対サイズ(px)
const ORIGIN_NATIVE_PX = 150; // .origin-innerのネイティブCSSサイズ(px)
const ORIGIN_CAP_SCALE = TARGET_ORIGIN_PX / ORIGIN_NATIVE_PX; // 上記を満たす絶対スケール値

function updateZoomVisuals(){
  // カット面フェード：baseScale比のDETAIL_LOW_MULT〜DETAIL_HIGH_MULTの間で、
  // 淡い光の点（遠景）からくっきりしたカット面SVG（近景）へクロスフェードする。
  const detail = clamp01((scale - baseScale*DETAIL_LOW_MULT) / (baseScale*(DETAIL_HIGH_MULT - DETAIL_LOW_MULT)));
  world.style.setProperty('--zoom-detail', detail.toFixed(3));

  // 星の見かけサイズ：絶対スケールCAP_SCALEを超えたら頭打ち（≒画面上でTARGET_STAR_PXで固定）
  const starFactor = Math.min(1, CAP_SCALE / scale);
  world.style.setProperty('--star-scale', starFactor.toFixed(4));

  // 数字ラベル：星がまだ頭打ち前で少し小さいLABEL_SCALEの時点から、一斉に
  // フェードイン（CSSのtransitionでふわりと）。未完成の星（ちいさな点／丸）も、
  // この--zoom-labelと完全に同じタイミングで同時にふわっと姿を現す
  // （CSS側で--zoom-labelを共有して参照している）。
  const label = scale >= LABEL_SCALE ? 1 : 0;
  world.style.setProperty('--zoom-label', label);

  // 星座線：ワールドのscaleを動的に相殺し、画面上は常に約1pxの太さを保つ
  const lineWidth = 1 / scale;
  world.style.setProperty('--star-line-width', lineWidth.toFixed(4) + 'px');

  // 「1」の星：通常の星より一回り大きい絶対スケール基準（ORIGIN_CAP_SCALE）を
  // 超えたら頭打ち。数字ラベルの出現タイミング自体は他の星と共通の
  // --zoom-labelがそのまま担うため、ここでは本体サイズの上限だけを制御する。
  // originFactorはCSS変数（--origin-scale）としても公開し、.origin-label側で
  // 「本体の拡大率」を打ち消して「通常の星と全く同じフォントサイズ」を
  // 実現するために使う（詳細は.origin-labelのCSSコメント参照）。
  const originFactor = Math.min(1, ORIGIN_CAP_SCALE / scale);
  world.style.setProperty('--origin-scale', originFactor.toFixed(4));
  originWrap.style.transform = 'translate(-50%,-50%) scale(' + originFactor.toFixed(4) + ')';
}

// 初期表示：STAGE1（九九の星たち）がしっかり肉眼で認識できる距離まで
// ズームインした画角をデフォルトにする（銀河全体を収めようとして
// 遠く引きすぎることのないよう、固定の見かけサイズから逆算する）。
function centerView(){
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  baseScale = DEFAULT_ZOOM_SCALE;
  scale = baseScale;
  panX = vw/2 - WORLD_HALF * scale;
  panY = vh/2 - WORLD_HALF * scale;
  applyTransform();
  updateZoomVisuals();
}
centerView();
window.addEventListener('resize', centerView);

// --- マウスドラッグ ---
let dragging = false, lastX = 0, lastY = 0;
app.addEventListener('mousedown', (e)=>{
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  app.classList.add('grabbing');
});
window.addEventListener('mousemove', (e)=>{
  if(!dragging) return;
  panX += e.clientX - lastX;
  panY += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
window.addEventListener('mouseup', ()=>{ dragging = false; app.classList.remove('grabbing'); });

// --- ホイールズーム（カーソル位置基準） ---
app.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  const factor = Math.exp(-e.deltaY * 0.0015);
  const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
  const ratio = newScale / scale;
  panX = cx - (cx - panX) * ratio;
  panY = cy - (cy - panY) * ratio;
  scale = newScale;
  applyTransform();
  updateZoomVisuals();
}, { passive:false });

// --- タッチ：ドラッグ & ピンチ ---
let touchMode = null;
let touchLastX = 0, touchLastY = 0;
let pinchStartDist = 0, pinchStartScale = 1;
let pinchCenter = {x:0,y:0};

function touchDist(t0, t1){
  return Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
}
function touchMid(t0, t1, rect){
  return { x:(t0.clientX + t1.clientX)/2 - rect.left, y:(t0.clientY + t1.clientY)/2 - rect.top };
}

app.addEventListener('touchstart', (e)=>{
  const rect = viewport.getBoundingClientRect();
  if(e.touches.length === 1){
    touchMode = 'pan';
    touchLastX = e.touches[0].clientX;
    touchLastY = e.touches[0].clientY;
  } else if(e.touches.length >= 2){
    touchMode = 'pinch';
    pinchStartDist = touchDist(e.touches[0], e.touches[1]);
    pinchStartScale = scale;
    pinchCenter = touchMid(e.touches[0], e.touches[1], rect);
  }
}, { passive:true });

app.addEventListener('touchmove', (e)=>{
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  if(touchMode === 'pan' && e.touches.length === 1){
    const dx = e.touches[0].clientX - touchLastX;
    const dy = e.touches[0].clientY - touchLastY;
    panX += dx; panY += dy;
    touchLastX = e.touches[0].clientX;
    touchLastY = e.touches[0].clientY;
    applyTransform();
  } else if(touchMode === 'pinch' && e.touches.length >= 2){
    const dist = touchDist(e.touches[0], e.touches[1]);
    const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, pinchStartScale * (dist / pinchStartDist)));
    const ratio = newScale / scale;
    panX = pinchCenter.x - (pinchCenter.x - panX) * ratio;
    panY = pinchCenter.y - (pinchCenter.y - panY) * ratio;
    scale = newScale;
    applyTransform();
    updateZoomVisuals();
  }
}, { passive:false });

app.addEventListener('touchend', (e)=>{
  if(e.touches.length === 0) touchMode = null;
  else if(e.touches.length === 1){
    touchMode = 'pan';
    touchLastX = e.touches[0].clientX;
    touchLastY = e.touches[0].clientY;
  }
});
<\/script>

  // ---- 星空マップ（iframeで埋め込んだ完成版マップ画面との連携） ----
  let starMapLoaded = false;   // iframe側のスクリプトが読み込み終わったか

  function buildStarMapPayload(){
    // 体験版は九九（1〜81）単体のみ。星空マップは常にgold（九九の星）のみ表示する。
    const target = STAGE_CONF[1].clearTarget;
    const stars = saveData.stars || {};
    const starProgress = {};
    Object.keys(stars).forEach(key => {
      starProgress[key] = target > 0 ? (stars[key] / target) : 0;
    });

    return {
      type: 'sync',
      starProgress: starProgress,
      timesTableMax: STAGE1_TIMES_TABLE_MAX
    };
  }
  function sendToStarMap(msg){
    if(starMapFrame.contentWindow){
      starMapFrame.contentWindow.postMessage(msg, '*');
    }
  }
  function syncStarMap(){
    if(!starMapLoaded) return;
    sendToStarMap(buildStarMapPayload());
  }
  starMapFrame.addEventListener('load', () => {
    starMapLoaded = true;
    syncStarMap();
  });

  // [一時的] 動作確認用：STAGE1（九九）の全数字を規定回数クリア済みにして、

  function testForceStage1AllCleared(){
